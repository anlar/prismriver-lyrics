[project]
name = "prismriver-lyrics"
dynamic = ["version"]
description = "Search song lyrics across multiple sources via a plugin system"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["../../LICENSE.txt"]
dependencies = [
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
]

[project.scripts]
prismriver-lyrics = "prismriver_lyrics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prismriver_lyrics"]

[tool.hatch.version]
path = "../../VERSION"
pattern = "(?P<version>.+)"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
