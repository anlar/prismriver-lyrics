[project]
name = "prismriver-lyrics-tui"
dynamic = ["version"]
description = "Terminal UI showing lyrics for the currently playing track via MPRIS"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["../../LICENSE.txt"]
dependencies = [
    "prismriver-lyrics",
    "textual>=0.58",
    "dbus-next>=0.2.3",
]

[project.scripts]
prismriver-lyrics-tui = "prismriver_lyrics_tui.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prismriver_lyrics_tui"]

[tool.hatch.version]
path = "../../VERSION"
pattern = "(?P<version>.+)"

[tool.uv.sources]
prismriver-lyrics = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "textual-dev>=1.5",
]
