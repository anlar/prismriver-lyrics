[project]
name = "prismriver-lyrics-tui"
dynamic = ["version"]
description = "Terminal UI showing lyrics for the currently playing track via MPRIS"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["../../LICENSE.txt"]
authors = [{ name = "Anton Larionov", email = "anton.larionov.dev@gmail.com" }]
keywords = ["lyrics", "mpris", "tui", "textual", "terminal"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "prismriver-lyrics",
    "textual>=8.2.8",
    "dbus-next>=0.2.3",
]

[project.urls]
Homepage = "https://github.com/anlar/prismriver-lyrics"
Repository = "https://github.com/anlar/prismriver-lyrics"
Issues = "https://github.com/anlar/prismriver-lyrics/issues"

[project.scripts]
prismriver-lyrics-tui = "prismriver_lyrics_tui.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prismriver_lyrics_tui"]

[tool.hatch.version]
path = "../../VERSION"
pattern = "(?P<version>.+)"

[tool.uv.sources]
prismriver-lyrics = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "textual-dev>=1.8.0",
]
