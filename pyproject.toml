[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "prismriver-lyrics",
    "prismriver-lyrics-tui",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.uv.sources]
prismriver-lyrics = { workspace = true }
prismriver-lyrics-tui = { workspace = true }

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "N",  # pep8-naming
]
